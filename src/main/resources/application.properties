spring.application.name=demo

# --- CONFIGURACIÓN HÍBRIDA (Local / Nube) ---
# Si existen las variables de entorno (en Render, Docker...), las usa.
# Si no existen (en tu PC), usa los valores por defecto de desarrollo.
# NUNCA escribas aquí contraseñas o claves reales: van en variables de entorno (ver .env.example).

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fiumplan_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:toor}

# Configuración de JPA
# 'update' crea/actualiza las tablas al arrancar. En producción real conviene Flyway/Liquibase
# (ponlo en 'validate' con DDL_AUTO=validate cuando las tablas ya existan).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
# las plantillas cargan las tareas al pintar la página, así que la sesión de BD sigue abierta durante la vista
spring.jpa.open-in-view=true
server.forward-headers-strategy=framework

# Subida de imágenes (foto de perfil)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Correo (SendGrid). Sin contraseña la app arranca igualmente, pero no se enviarán correos.
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=587
spring.mail.username=${MAIL_USER:apikey}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Remitente: debe ser un remitente verificado en SendGrid
app.mail.from=${MAIL_FROM:informaticafrv1@gmail.com}

# Cloudinary. Sin credenciales la app arranca, pero el registro con foto de perfil fallará con un aviso.
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
