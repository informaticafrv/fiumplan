services:
  mysqldb:
    image: mysql:8.0
    container_name: fiumplan_db_docker
    environment:
      MYSQL_DATABASE: fiumplan_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-toor}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: fiumplan_app_docker
    ports:
      # solo en localhost: Apache hace de proxy. El 8080 del VPS lo usa otro servicio
      - "127.0.0.1:8090:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysqldb:3306/fiumplan_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-toor}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-informaticafrv1@gmail.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

volumes:
  mysql_data:
